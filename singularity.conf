server {
    listen 80;
    server_name singularity.danidajay.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name singularity.danidajay.com;

    ssl_certificate /etc/letsencrypt/live/singularity.danidajay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singularity.danidajay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/singularity.access.log;
    error_log /var/log/nginx/singularity.error.log;

    location / {
        proxy_pass http://singularity-client:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
